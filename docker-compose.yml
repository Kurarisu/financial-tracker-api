services:
  # PHP 8.2 Application Server
  app:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: laravel-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - laravel-network
    depends_on:
      - postgres

  # Nginx Web Server
  web:
    image: nginx:alpine
    container_name: laravel-web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-network
    depends_on:
      - app

  # PostgreSQL Database Server
  postgres:
    image: postgres:16-alpine
    container_name: laravel-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: api_laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - laravel-network

  # pgAdmin 4 (PostgreSQL Web Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: laravel-pgadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: secret
    networks:
      - laravel-network
    depends_on:
      - postgres

volumes:
  postgres-data:
    driver: local

networks:
  laravel-network:
    driver: bridge
